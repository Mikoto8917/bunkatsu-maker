<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<body>
<title>分割メーカー</title>
<script>
/* テーマ（アクセント色と外観）。起動直後に保存済みの色を当てて、一瞬青く見えるのを防ぐ。app.js からも使う */
window.BunkatsuTheme = (function () {
  var COLORS = [
    ['blue', 'ブルー', '#1f6feb', '#5b9bff'], ['indigo', 'インディゴ', '#4f46e5', '#8b8cff'], ['purple', 'パープル', '#7c3aed', '#b38bff'],
    ['pink', 'ピンク', '#db2777', '#ff7ab6'], ['red', 'レッド', '#dc2626', '#ff6b6b'], ['orange', 'オレンジ', '#c2410c', '#ff9a52'],
    ['gold', 'ゴールド', '#a16207', '#f5c04a'], ['green', 'グリーン', '#15803d', '#4fcf8e'], ['teal', 'ティール', '#0f766e', '#3fd4c4'],
    ['graphite', 'グラファイト', '#37352f', '#e6e6e6'],
  ].map(function (c) { return { id: c[0], name: c[1], light: c[2], dark: c[3] }; });
  var BG = { light: '#f1f2f4', dark: '#0c0d10' };
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : { matches: false };
  var cur = { accent: 'blue', mode: 'auto' };
  // a を b に p の割合で混ぜる（#rrggbb）。color-mix が使えない古い iPhone でも同じ色になるように自前で計算する
  function mix(a, b, p) {
    var x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16), o = '#';
    [16, 8, 0].forEach(function (s) { var v = Math.round(((x >> s) & 255) * p + ((y >> s) & 255) * (1 - p)); o += ('0' + v.toString(16)).slice(-2); });
    return o;
  }
  function find(id) { for (var i = 0; i < COLORS.length; i++) if (COLORS[i].id === id) return COLORS[i]; return COLORS[0]; }
  function isDark() { return cur.mode === 'dark' || (cur.mode !== 'light' && mq.matches); }
  function apply(t) {
    if (t) cur = { accent: find(t.accent).id, mode: ['light', 'dark'].indexOf(t.mode) >= 0 ? t.mode : 'auto' };
    var r = document.documentElement, dark = isDark(), c = find(cur.accent);
    if (cur.mode === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', cur.mode);
    // ブルーは今までどおり CSS の値を使う。ほかの色は --accent と --accent-soft だけ上書きする（部位の色・--ok・--warn は変えない）
    if (c.id === 'blue') { r.style.removeProperty('--accent'); r.style.removeProperty('--accent-soft'); }
    else {
      var a = dark ? c.dark : c.light;
      r.style.setProperty('--accent', a);
      r.style.setProperty('--accent-soft', dark ? mix(a, '#17191d', 0.22) : mix(a, '#ffffff', 0.14));
    }
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
      if (!m.dataset.orig) m.dataset.orig = m.content;
      m.content = cur.mode === 'auto' ? m.dataset.orig : BG[cur.mode];
    });
    // ホーム画面に追加するときのアイコン（スマホ版だけ。1つの HTML 版にはリンクがない）
    var icon = document.querySelector('link[rel="icon"]'), touch = document.querySelector('link[rel="apple-touch-icon"]');
    if (icon) icon.href = c.id === 'blue' ? 'icon-192.png' : 'icons/icon-' + c.id + '-192.png';
    if (touch) touch.href = c.id === 'blue' ? 'apple-touch-icon.png' : 'icons/icon-' + c.id + '-180.png';
  }
  try { var saved = JSON.parse(localStorage.getItem('bunkatsu.v1') || 'null'); if (saved && saved.theme) apply(saved.theme); } catch (e) { /* 読めなければ初期の色 */ }
  if (mq.addEventListener) mq.addEventListener('change', function () { apply(); });
  return { COLORS: COLORS, apply: apply, isDark: isDark, current: function () { return cur; } };
})();
</script>
<style>
/* MacroFactor風：明るい地にカードを積むダッシュボード。数字を大きく、目標と実績を円とバーで並べる。超過しても赤くしない */
:root {
  --bg: #f1f2f4;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --line: #e2e4e9;
  --fg: #37352f; /* Notion の文字色 */
  --muted: #6a707c;
  --accent: #1f6feb;
  --accent-soft: #e3edfd;
  --accent-ink: #ffffff;
  --ok: #1f9d63;
  --warn: #c4561d;
  --track: #e8eaee;
  --c-full: #d39a12;
  --c-upper: #6c5ce7;
  --c-push: #e0603a;
  --c-pull: #2b7de9;
  --c-legs: #1f9d63;
  --c-arms: #cc4f8e;
  --font-display: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, "Noto Sans JP", Arial, sans-serif;
  /* Notion と同じく端末の標準フォント（iPhone・Mac はヒラギノ、Windows は Yu Gothic UI、Android は Noto Sans JP） */
  --font-body: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, "Noto Sans JP", Arial, sans-serif;
  --font-num: var(--font-body);
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0d10; --surface: #17191d; --surface-2: #1f2227; --line: #2a2d33; --fg: #eef0f3; --muted: #959ba6;
    --accent: #5b9bff; --accent-soft: #1b2a44; --accent-ink: #0c0d10; --ok: #43c486; --warn: #f08a5d; --track: #2a2e35;
    --c-full: #f0bd45; --c-upper: #a597ff; --c-push: #ff8a66; --c-pull: #6aa8ff; --c-legs: #4fcf8e; --c-arms: #f28cc0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0d10; --surface: #17191d; --surface-2: #1f2227; --line: #2a2d33; --fg: #eef0f3; --muted: #959ba6;
  --accent: #5b9bff; --accent-soft: #1b2a44; --accent-ink: #0c0d10; --ok: #43c486; --warn: #f08a5d; --track: #2a2e35;
  --c-full: #f0bd45; --c-upper: #a597ff; --c-push: #ff8a66; --c-pull: #6aa8ff; --c-legs: #4fcf8e; --c-arms: #f28cc0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
/* 横にずれないようにする（iPhone でははみ出しが1pxでもあると左右に動く） */
html { overflow-x: hidden; overscroll-behavior-x: none; }
body { overflow-x: clip; max-width: 100%; }
body { color: var(--fg); font-family: var(--font-body); font-weight: 400; font-size: 16px; line-height: 1.6; padding-inline: 16px; padding-block: 0; -webkit-text-size-adjust: 100%; }
main { max-width: 480px; margin: 0 auto; padding-block: 16px 120px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--font-display); }
p { margin: 0; }
.num, input, .wheel li, .rest-time { font-variant-numeric: tabular-nums; }
.num { font-family: var(--font-num); }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.display { font-size: clamp(32px, 9vw, 42px); font-weight: 700; line-height: 1.15; }
.display.small { font-size: 26px; }
.title { font-size: 28px; font-weight: 700; line-height: 1.2; }
.big { font-size: 26px; font-weight: 700; line-height: 1.2; }
.big2 { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.ok { color: var(--ok); } .warn { color: var(--warn); }
section { display: flex; flex-direction: column; gap: 12px; }

/* テーマ色 */
.c-full { --c: var(--c-full); } .c-upper { --c: var(--c-upper); } .c-push { --c: var(--c-push); }
.c-pull { --c: var(--c-pull); } .c-legs { --c: var(--c-legs); } .c-arms { --c: var(--c-arms); }
.cc { color: var(--c, var(--fg)); }

/* ボタン */
.btn { font: inherit; font-weight: 700; min-height: 50px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--surface-2); color: var(--fg); cursor: pointer; width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.tiny { min-height: 40px; width: auto; padding: 0 14px; font-size: 14px; border-radius: 99px; }
.btn.danger { background: #dc2626; color: #ffffff; }
:root[data-theme="dark"] .btn.danger { background: #ff6b6b; color: #0c0d10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.danger { background: #ff6b6b; color: #0c0d10; } }
.btn:disabled { opacity: .4; cursor: default; }
.linkbtn { font: inherit; background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 6px 0; min-height: 36px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.row { flex-direction: row; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h3 { font-size: 20px; }
.card h3 small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; }
.cardhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.pagehead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 8px 4px; }
.planname { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface); border-radius: 99px; padding: 4px 10px; }
.samplebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); color: var(--accent); border-radius: 14px; padding: 8px 8px 8px 14px; font-size: 13px; font-weight: 700; }
.samplebar .btn { background: var(--accent); color: var(--accent-ink); }

/* リング */
.ringwrap { position: relative; display: grid; place-items: center; flex: none; }
.ring-bg { fill: none; stroke: var(--track); stroke-width: 10; }
.ring-fg { fill: none; stroke: var(--c, var(--accent)); stroke-width: 10; stroke-linecap: round; transition: stroke-dasharray .3s; }
.ringnum { position: absolute; font-size: 22px; font-weight: 600; }
.ringnum.small { font-size: 16px; }
.ringnum small { font-size: .6em; color: var(--muted); }

/* はじめに */
.welcome { padding-top: 24px; gap: 20px; }
.welcome .lead { color: var(--muted); }
.facts { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.facts li { padding: 12px 14px; background: var(--surface); border-radius: 14px; }
.facts b { color: var(--accent); }

/* 質問 */
.progress { height: 4px; background: var(--track); border-radius: 4px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.q { font-size: 26px; font-weight: 700; }
.note, .hint { color: var(--muted); font-size: 14px; }
.hint small { font-size: 13px; }
.opts { display: grid; gap: 10px; }
.opts.grid3 { grid-template-columns: repeat(3, 1fr); }
.opt { font: inherit; text-align: left; min-height: 56px; padding: 12px 16px; border-radius: 14px; border: 2px solid transparent; background: var(--surface); color: var(--fg); cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.opt span { font-weight: 700; font-size: 17px; }
.opt small { color: var(--muted); font-size: 13px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.grid3 .opt { text-align: center; align-items: center; }
.wdpick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.opt.wd { padding: 0; align-items: center; font-weight: 700; font-size: 17px; }
.opt.wd[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface-2); border: 1.5px solid transparent; border-radius: 10px; }
.numfield { display: flex; align-items: baseline; gap: 8px; }
.numfield input { font-family: var(--font-num); font-size: 36px; width: 6ch; padding: 8px 12px; background: var(--surface); }
.numfield span { font-size: 18px; color: var(--muted); }
.lifts { display: grid; gap: 10px; }
.liftrow { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 6px; background: var(--surface); border-radius: 14px; padding: 10px 12px; }
.liftname { font-weight: 700; font-size: 15px; min-width: 0; }
.liftrow label { display: flex; align-items: baseline; gap: 3px; }
.liftrow input { width: 4.6ch; min-height: 44px; padding: 6px 8px; font-family: var(--font-num); font-size: 17px; text-align: right; }
.liftrow label span, .times { color: var(--muted); font-size: 13px; }
.quiznav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 8px; }

/* 結果 */
.reason { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.badge-line { margin-top: -6px; }
.strip { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.strip li { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 10px; background: color-mix(in srgb, var(--c, var(--track)) 16%, var(--surface)); min-width: 0; }
.strip li.rest { background: var(--surface-2); }
.strip .w { font-size: 12px; color: var(--muted); }
.strip .l { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.25; word-break: break-all; color: var(--c, var(--muted)); }
.levelrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sel select { min-height: 44px; padding: 0 10px; }
.targets { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px 14px; }
.targets li { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-block: 4px; font-size: 14px; }
.targets b { font-size: 16px; }
.scores summary { cursor: pointer; font-weight: 700; min-height: 32px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 13px; width: 100%; min-width: 520px; }
th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
td.num { text-align: right; }
tr.is-on th { color: var(--accent); }
th small { display: block; color: var(--muted); font-weight: 500; }
.switch { display: flex; gap: 10px; align-items: center; min-height: 44px; font-weight: 700; font-size: 15px; cursor: pointer; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

/* ダッシュボード */
.todayrow { display: flex; align-items: center; gap: 16px; }
.todaytxt { min-width: 0; flex: 1; display: grid; gap: 2px; }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.tips li { padding: 10px 14px; border-radius: 12px; background: var(--surface-2); }
.weekstrip { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.weekstrip button { font: inherit; width: 100%; background: none; border: 0; color: var(--fg); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; border-radius: 12px; min-height: 76px; }
.weekstrip .is-today button { background: var(--surface-2); }
.weekstrip .w { font-size: 12px; color: var(--muted); font-weight: 700; }
.weekstrip .is-today .w { color: var(--fg); }
.pip { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--c, var(--track)); }
.st-done .pip { background: var(--c); }
.st-rest .pip { border-style: dashed; border-color: var(--line); }
.st-missed .pip { border-color: var(--line); }
.weekstrip .l { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.2; word-break: break-all; }
.st-done .l, .st-planned .l { color: var(--c); }
.volhead { display: flex; align-items: center; gap: 16px; }
.vol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.vol li { display: grid; grid-template-columns: 7.2em 1fr 4.6em; align-items: center; gap: 10px; font-size: 13px; }
.vbar { height: 8px; border-radius: 8px; background: var(--track); overflow: hidden; }
.vbar span { display: block; height: 100%; background: var(--accent); border-radius: 8px; transition: width .3s; }
.vol li.is-met .vbar span { background: var(--ok); }
.vn { text-align: right; } .vn small { color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { font: inherit; font-size: 13px; font-weight: 700; border: 0; background: none; color: var(--muted); border-radius: 9px; min-height: 36px; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.swatches { display: grid; grid-template-columns: repeat(5, 40px); justify-content: space-between; row-gap: 14px; margin: 4px 0 16px; padding: 0; list-style: none; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: var(--sw); cursor: pointer; position: relative; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--sw); }
.swatch[aria-pressed="true"]::after { content: ''; position: absolute; left: 14px; top: 11px; width: 8px; height: 14px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: rotate(45deg); }
.themecard .seg { margin-bottom: 10px; }
.trendhead { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.delta { font-size: 14px; font-weight: 600; color: var(--ok); margin-left: 6px; }
.trend { width: 100%; height: auto; display: block; }
.trend .grid { stroke: var(--line); stroke-width: 1; }
.trend .axis { fill: var(--muted); font-size: 10px; font-family: var(--font-num); }
.trend .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.trend .area { fill: var(--accent); fill-opacity: .1; }
.trend .pt { fill: var(--accent); }
.trend .end { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
.trend .endlabel { fill: var(--fg); font-size: 12px; font-weight: 600; font-family: var(--font-num); }
.chartempty { padding: 24px 8px; text-align: center; background: var(--surface-2); border-radius: 12px; }

/* 記録 */
.datenav { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--r); padding: 6px; }
.navbtn { font: inherit; font-size: 26px; line-height: 1; background: var(--surface-2); border: 0; color: var(--fg); border-radius: 12px; min-height: 44px; cursor: pointer; }
.datelabel { display: flex; flex-direction: column; align-items: center; line-height: 1.3; }
.datelabel b { font-size: 17px; }
.today .display { color: var(--muted); }
.loghead .todayrow .btn { flex: none; }
.picker { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; font-weight: 700; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--c, var(--line)); background: transparent; color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--c, var(--fg)); color: var(--surface); }
.exlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ex { background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.exhead h3 { font-size: 17px; min-width: 0; }
.ex.is-folded { padding-block: 10px; }
.ex.is-folded .exhead { align-items: center; }
.ex.is-done.is-folded .exhead h3 { color: var(--muted); font-size: 16px; }
.exhead { cursor: pointer; }
.ex.is-folded:not(.is-done) .foldbtn { color: var(--muted); }
.foldarr { margin-left: 6px; font-size: 11px; }
.logadd { margin: 12px 0; }
.logadd.is-open { padding: 12px 0 4px; }
.logadd .cadd { padding: 0 12px 10px; }
.logadd .cadd input { flex: 1; min-width: 0; min-height: 40px; padding: 0 8px; }
.logadd .cadd select { background: var(--surface-2); }
.logadd #la-m { flex: 0 0 38%; }
.logadd p { padding: 0 12px; }

#rest .rest-main { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: grid; }
#rest .rest-label { font-size: 12px; font-weight: 700; opacity: .75; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

[data-grip] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

</style>
